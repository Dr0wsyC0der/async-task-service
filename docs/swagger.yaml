basePath: /
definitions:
  domain.Status:
    enum:
    - in_progress
    - ready
    type: string
    x-enum-varnames:
    - StatusInProgress
    - StatusReady
  handler.CreateTaskRequest:
    properties:
      code:
        type: string
      language:
        type: string
    type: object
  handler.CreateTaskResponse:
    properties:
      task_id:
        type: string
    type: object
  handler.CredentialsRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handler.LoginResponse:
    properties:
      token:
        type: string
    type: object
  handler.TaskResultResponse:
    properties:
      result:
        type: string
    type: object
  handler.TaskStatusResponse:
    properties:
      status:
        $ref: '#/definitions/domain.Status'
    type: object
host: localhost:8000
info:
  contact: {}
  description: API for asynchronous code execution tasks.
  title: Code Execution Service API
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: Verify credentials and return a session token.
      parameters:
      - description: Username and password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CredentialsRequest'
      produces:
      - application/json
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.LoginResponse'
        "400":
          description: Invalid JSON
          schema:
            type: string
        "401":
          description: Invalid credentials
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Log in
      tags:
      - auth
  /register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Username and password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CredentialsRequest'
      produces:
      - text/plain
      responses:
        "201":
          description: User registered
        "400":
          description: Invalid request or registration data
          schema:
            type: string
        "409":
          description: Username already exists
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Register a user
      tags:
      - auth
  /result/{task_id}:
    get:
      description: Returns the result of a completed task
      parameters:
      - description: Task ID
        in: path
        name: task_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TaskResultResponse'
        "202":
          description: Task is still processing
        "401":
          description: Missing or invalid session token
          schema:
            type: string
        "404":
          description: Task not found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get task result
      tags:
      - tasks
  /status/{task_id}:
    get:
      description: Returns the current processing status of a task
      parameters:
      - description: Task ID
        in: path
        name: task_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.TaskStatusResponse'
        "401":
          description: Missing or invalid session token
          schema:
            type: string
        "404":
          description: Task not found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get task status
      tags:
      - tasks
  /task:
    post:
      consumes:
      - application/json
      description: Submit code for asynchronous processing
      parameters:
      - description: Task data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.CreateTaskResponse'
        "400":
          description: Invalid request
          schema:
            type: string
        "401":
          description: Missing or invalid session token
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create a new task
      tags:
      - tasks
securityDefinitions:
  BearerAuth:
    description: Enter Bearer followed by a space and the session token from POST
      /login.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
